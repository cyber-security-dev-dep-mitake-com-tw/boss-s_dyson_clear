name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Prepare signing certificate (real cert if provided, else self-signed)
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_CSC_LINK)) {
            Write-Host "No real certificate secret found - generating SELF-SIGNED certificate (testing only)"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SweepDeck Dev (self-signed)" -CertStoreLocation Cert:\CurrentUser\My
            $pwd = ConvertTo-SecureString -String "sweepdeck-selfsign" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\selfsign.pfx" -Password $pwd | Out-Null
            "CSC_LINK=$env:RUNNER_TEMP\selfsign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CSC_KEY_PASSWORD=sweepdeck-selfsign" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Using real certificate from secrets"
            "CSC_LINK=$env:WIN_CSC_LINK" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CSC_KEY_PASSWORD=$env:WIN_CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Package installers (.exe NSIS + .msi)
        run: npx electron-builder --win nsis msi --publish never
        working-directory: packages/app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            packages/app/release/*.exe
            packages/app/release/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Prepare signing certificate (real cert if provided, else self-signed)
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "No real certificate secret found - generating SELF-SIGNED certificate (testing only)"
            openssl req -x509 -newkey rsa:2048 -days 365 -nodes \
              -keyout "$RUNNER_TEMP/selfsign.key" -out "$RUNNER_TEMP/selfsign.crt" \
              -subj "/CN=SweepDeck Dev (self-signed)" \
              -addext "extendedKeyUsage=codeSigning" \
              -addext "keyUsage=digitalSignature"
            # -legacy: OpenSSL 3 defaults to ciphers macOS `security import` rejects
            openssl pkcs12 -export -legacy \
              -inkey "$RUNNER_TEMP/selfsign.key" -in "$RUNNER_TEMP/selfsign.crt" \
              -out "$RUNNER_TEMP/selfsign.p12" -password pass:sweepdeck-selfsign \
            || openssl pkcs12 -export \
              -inkey "$RUNNER_TEMP/selfsign.key" -in "$RUNNER_TEMP/selfsign.crt" \
              -out "$RUNNER_TEMP/selfsign.p12" -password pass:sweepdeck-selfsign
            echo "CSC_LINK=$RUNNER_TEMP/selfsign.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=sweepdeck-selfsign" >> "$GITHUB_ENV"
          else
            echo "Using real certificate from secrets"
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Package installers (.dmg + .pkg)
        env:
          # Self-signed builds cannot be notarized; real releases should set notarize secrets
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        run: npx electron-builder --mac dmg pkg --publish never -c.mac.notarize=false
        working-directory: packages/app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.pkg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.pkg
